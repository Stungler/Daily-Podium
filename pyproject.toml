[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-games-bot"
version = "0.1.0"
description = "Independent daily Discord competitions for TimeGuessr, Size It Up, and Metazooa"
requires-python = ">=3.12"
dependencies = ["discord.py>=2.6,<3", "python-dotenv>=1,<2", "filelock>=3.16,<4", "tzdata>=2025.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[project.scripts]
daily-games-bot = "daily_games.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
